name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generated output is up to date
        run: node scripts/build.mjs --check
      - name: Internal links, fragments and assets
        run: node scripts/check-links.mjs
      - name: External repository and demo links
        run: node scripts/check-links.mjs --external
