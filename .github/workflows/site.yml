name: Site checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run check:external
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-verification
          path: |
            memory/screenshots
            memory/browser-results.json
            .lighthouse
          include-hidden-files: true
